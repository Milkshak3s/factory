# Builds the installers for every platform and leaves them on one draft release. The pipeline pushes
# to `release`, waits for this workflow, then sets the notes and publishes the draft. A failure on any
# platform fails the whole run, so a release never goes out with assets missing.
name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

env:
  WIX_VERSION: 6.0.2
  # Lets the pinned WiX tool run on whichever newer .NET runtime the runner has.
  DOTNET_ROLL_FORWARD: Major
  # The tag on AppImage/appimagetool that packaging/appimage.sh downloads, and that file's checksum.
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Each step below ends in the native command that matters, so its exit code fails the step.
      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Use stable Rust
        run: rustup default stable

      - name: Read the version
        id: version
        run: |
          $version = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages[0].version
          if (-not $version) { throw 'Could not read the version from Cargo.toml' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set a git identity for the tests
        run: |
          git config --global user.name "factory-ci"
          git config --global user.email "factory-ci@users.noreply.github.com"

      - name: Make sure make is installed
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install make' }
          }

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Install WiX
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
          dotnet tool install --global wix --version $env:WIX_VERSION

      - name: Build the MSI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          wix build wix/main.wxs -arch x64 -d "Version=$version" -d "ExePath=target\release\factory.exe" -d "IconPath=target\release\factory.ico" -o "dist\factory-$version-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: factory-windows
          path: dist/*
          if-no-files-found: error

  macos:
    # macos-latest is arm64.
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Use stable Rust
        run: rustup default stable

      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[0].version')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set a git identity for the tests
        run: |
          git config --global user.name "factory-ci"
          git config --global user.email "factory-ci@users.noreply.github.com"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Build the DMG
        run: bash packaging/macos.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: factory-macos
          path: dist/*
          if-no-files-found: error

  linux:
    # The oldest hosted image, so the binary asks for as old a glibc as possible.
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install the egui build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libfontconfig1-dev

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Use stable Rust
        run: rustup default stable

      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[0].version')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set a git identity for the tests
        run: |
          git config --global user.name "factory-ci"
          git config --global user.email "factory-ci@users.noreply.github.com"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Build the AppImage
        run: bash packaging/appimage.sh "${{ steps.version.outputs.version }}"

      - name: Build the .deb
        run: bash packaging/deb.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: factory-linux
          path: dist/*
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          version="$VERSION"
          test -n "$version"
          assets=(
            "dist/factory-$version-x64.msi"
            "dist/factory-$version-arm64.dmg"
            "dist/factory-$version-x64.AppImage"
            "dist/factory-$version-x64.deb"
          )
          for asset in "${assets[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "$asset was not produced" >&2
              exit 1
            fi
          done
          gh release create "v$version" "${assets[@]}" --draft --target "$GITHUB_SHA" --title "factory v$version" --notes "Release notes pending."
